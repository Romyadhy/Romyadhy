name: Update Language Stats

on:
  schedule:
    - cron: "0 0 * * *" # runs daily at midnight UTC
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Calculate Languages & Update README
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN_READMEFILE_METRICS }}
          GITHUB_USER: Romyadhy
        run: |
          python scripts/update_languages.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet README.md || (git commit -m "docs: update language stats [skip ci]" README.md && git push)
